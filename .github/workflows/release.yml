name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: ManyHosts-windows-amd64.exe
            syso: resources/manifest/admin_amd64.syso
            staged: manifest_windows_amd64.syso
          - goos: windows
            goarch: arm64
            artifact: ManyHosts-windows-arm64.exe
            syso: resources/manifest/admin_arm64.syso
            staged: manifest_windows_arm64.syso
          - goos: darwin
            goarch: amd64
            artifact: manyhosts-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: manyhosts-darwin-arm64
          - goos: linux
            goarch: amd64
            artifact: manyhosts-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: manyhosts-linux-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Windows 构建需要把管理员 manifest 放到 Go 能识别的包目录。
      - name: Stage Windows manifest
        if: matrix.goos == 'windows'
        run: cp "${{ matrix.syso }}" "${{ matrix.staged }}"

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -ldflags "-H=windowsgui" -o "${{ matrix.artifact }}" .
          else
            go build -o "${{ matrix.artifact }}" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
